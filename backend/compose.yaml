# Local infrastructure for Lunex Finance backend.
# Ports are shifted (5442, 6390) so they do not clash with other local Postgres/Redis instances.
name: lunex

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lunex
      POSTGRES_PASSWORD: lunex
      POSTGRES_DB: lunex
    ports:
      - '5442:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lunex -d lunex']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6390:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
