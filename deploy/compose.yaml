# Production on the server (/home/lunex/app): the API only. The server's PostgreSQL (database
# lunex_db) and Redis (database 10) are shared by all its projects and listen on 127.0.0.1, so
# the API joins the host network and listens on 127.0.0.1:3100; HestiaCP's nginx serves
# https://api.lunex.my in front of it (template in hestia/). deploy.sh copies this folder and
# backend/ there; setup.sh prepares the domain, the database and .env.
name: lunex

services:
  api:
    build: ./backend
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: 3100
      # nginx is the one proxy in front
      TRUST_PROXY: 1
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3100/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
